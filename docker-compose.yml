#version: '3.8'

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && gunicorn --bind 0.0.0.0:10000 EneoNewsletter.wsgi"
    ports:
      - "10000:10000"
    env_file: ".env"
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  celery:
    build: .
    command: celery -A EneoNewsletter worker --loglevel=info
    env_file: ".env"
    restart: unless-stopped
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A EneoNewsletter beat --loglevel=info
    env_file: ".env"
    restart: unless-stopped
    volumes:
      - .:/app

volumes:
  static_volume:
  media_volume:
